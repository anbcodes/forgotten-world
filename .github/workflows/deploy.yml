name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Install deps
        working-directory: build
        run: npm ci

      - name: Build
        working-directory: build
        run: npm run build

      - name: Deploy
        working-directory: build
        run: npm run deploy
