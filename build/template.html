<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/style.css" />
        <title>{{metaTitle}} - A Forgotten World</title>
        <meta name="description" content="{{metaDescription}}" />
    </head>

    <body>
        <div class="page">
            <header class="site-header">
                <h1 class="title">A Forgotten World</h1>
                <p class="subtitle">Fragments from an older world</p>
            </header>

            <nav class="nav">
                <a href="/">Home</a>
                <a href="/archive">Archives</a>
                <a href="/about">About</a>
            </nav>

            <main class="content">
                <article class="entry">
                    <h1>{{title}}</h1>
                    <p class="meta">{{subtitle}}</p>
                    <div class="text">{{content}}</div>
                </article>
            </main>

            <footer class="footer">
                <p>Collected from ages long gone.</p>
            </footer>
        </div>
    </body>
</html>
